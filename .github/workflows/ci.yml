name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nero_test
      POSTGRES_TIMEOUT: 10s
      POSTGRES_SSLMODE: disable

    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nero_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Получить исходники
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Подготовить Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Подготовить Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Установить зависимости UI
        run: npm ci

      - name: Собрать UI
        run: npm run build:ui

      - name: Применить миграции к тестовой базе
        run: |
          docker run --rm --network host \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/migrations,target=/migrations,readonly" \
            migrate/migrate:v4.19.1 \
            -path /migrations \
            -database "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE}" \
            up

      - name: Запустить обычные и интеграционные тесты
        run: go test -tags=integration -count=1 ./...

      - name: Проверить код
        run: go vet -tags=integration ./...

      - name: Проверить сборку образа для PR
        if: github.event_name == 'pull_request'
        run: docker build --platform linux/amd64 -t nero:ci .

  publish:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Получить исходники
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Определить имя образа
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Подготовить Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Войти в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать и опубликовать образ
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Записать опубликованный образ
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Коммит: %s\n\nОбраз: %s:sha-%s\n\nОбраз для деплоя: %s@%s\n' \
            "$GITHUB_SHA" "$IMAGE_NAME" "$GITHUB_SHA" \
            "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
